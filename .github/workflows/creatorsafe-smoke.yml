name: CreatorSafe safety smoke

on:
  pull_request:
  push:
    branches:
      - creatorsafe/shorts-mvp

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run policy and engine-contract tests without providers or credentials
        run: python -m unittest discover -s test/services -p test_creatorsafe.py -v

  native-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the existing engine's minimal media dependencies
        run: >-
          python -m pip install moviepy==2.2.1 imageio-ffmpeg==0.6.0
          loguru==0.7.3 toml==0.10.2 'pydantic>=2,<3'
      - name: Verify native zoom-out direction and absence of black borders
        run: python -m unittest discover -s test/services -p test_creatorsafe_zoom_out.py -v
